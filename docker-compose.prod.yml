# ============================================================
#  Corten Steel — 耐候钢与精密钣金制造商外贸独立站 (Production)
#  技术栈：Nginx + WordPress(PHP 8.3 FPM) + MariaDB 11.4 + Redis
#  访问地址：http://47.239.52.41:8081/
#
#  启动：docker compose -f docker-compose.prod.yml -p corten-steel up -d
#  停止：docker compose -f docker-compose.prod.yml -p corten-steel down
# ============================================================

services:
  nginx:
    image: nginx:1.27.5-alpine
    container_name: corten_nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      DOMAIN: ${DOMAIN:-47.239.52.41:8081}
    volumes:
      - ./nginx/conf.d/wordpress.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - wp_data:/var/www/html:ro
      - ./wordpress/wp-content/themes/corten-steel:/var/www/html/wp-content/themes/corten-steel:ro
      - ./wordpress/wp-content/plugins/corten-core:/var/www/html/wp-content/plugins/corten-core:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  wordpress:
    image: wordpress:6.8.3-php8.3-fpm
    container_name: corten_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-corten_steel}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-corten}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-CHANGE_ME_WP}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        if (!empty($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $_SERVER['HTTPS'] = 'on';
        }
        define('WP_HOME', 'http://47.239.52.41:8081');
        define('WP_SITEURL', 'http://47.239.52.41:8081');
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/wp-content/themes/corten-steel:/var/www/html/wp-content/themes/corten-steel
      - ./wordpress/wp-content/plugins/corten-core:/var/www/html/wp-content/plugins/corten-core
      - ./wordpress/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: mariadb:11.4
    container_name: corten_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-corten_steel}
      MYSQL_USER: ${MYSQL_USER:-corten}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME_WP}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine
    container_name: corten_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  wp_data:
  db_data:
  redis_data:
