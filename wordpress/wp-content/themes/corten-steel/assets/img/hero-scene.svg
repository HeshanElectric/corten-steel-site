<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#241c18"/>
      <stop offset="55%" stop-color="#161311"/>
      <stop offset="100%" stop-color="#0e0c0b"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e08a3c"/>
      <stop offset="28%" stop-color="#c45c2a"/>
      <stop offset="62%" stop-color="#8a3a22"/>
      <stop offset="100%" stop-color="#4a2318"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
    <filter id="bloom" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.018" numOctaves="4" seed="19" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="38" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="horizon">
      <path d="M0 430 C 280 390, 420 510, 720 470 S 1180 360, 1480 430 S 1760 560, 1920 520 L 1920 1080 L 0 1080 Z"/>
    </clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <g filter="url(#bloom)" clip-path="url(#horizon)">
    <path fill="url(#plate)" d="M-40 520 C 180 300, 360 620, 620 410 S 980 720, 1240 480 S 1620 760, 1980 500 L 1980 1100 L -40 1100 Z"/>
    <path fill="#6b2e1c" opacity="0.55" d="M120 700 C 340 560, 520 820, 780 640 S 1180 880, 1460 680 S 1780 900, 1920 760 L 1920 1080 L 0 1080 Z"/>
    <path fill="#d97706" opacity="0.22" d="M240 620 C 480 480, 620 740, 900 560 S 1280 780, 1600 600"/>
  </g>
  <g fill="#1a1410" opacity="0.35" filter="url(#grain)">
    <path d="M210 480 L 560 430 L 540 820 L 190 790 Z"/>
    <path d="M620 390 L 880 340 L 910 860 L 600 820 Z"/>
    <path d="M1000 470 L 1480 420 L 1510 780 L 980 810 Z"/>
    <path d="M1560 400 L 1860 360 L 1880 820 L 1540 790 Z"/>
  </g>
  <path fill="none" stroke="#d9a066" stroke-opacity="0.28" stroke-width="1.2" d="M80 200 C 420 80, 780 260, 1100 140 S 1640 80, 1860 220"/>
  <circle cx="1640" cy="210" r="90" fill="none" stroke="#b85c38" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="1640" cy="210" r="42" fill="#b85c38" fill-opacity="0.18"/>
  <rect width="1920" height="1080" fill="#1a1a1a" opacity="0.12" filter="url(#grain)"/>
</svg>
